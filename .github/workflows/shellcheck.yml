name: Shellcheck Lint

on:
  push:
    paths:
      # Run workflow on every push
      # only if a file within the specified paths has been changed:
      - 'rbme'
      - '.github/workflows/shellcheck.yml'

  pull_request:
    paths:
      # Run workflow on every push
      # only if a file within the specified paths has been changed:
      - 'rbme'
      - '.github/workflows/shellcheck.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Restrict permissions for pull requests to read-only for security
permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck Lint
    runs-on: ubuntu-latest

    steps:
      # Required to access files of this repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Run Shellcheck using the community action
      # ---
      # https://github.com/ludeeus/action-shellcheck
      # ---
      # Excluded checks:
      # https://www.shellcheck.net/wiki/SC1091 -- Not following: /etc/rc.status was...
      # https://www.shellcheck.net/wiki/SC1090 -- Can't follow non-constant source. ..
      # ---
      - name: Run Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: '.'
          severity: warning
          ignore_paths: '.git'
        env:
          SHELLCHECK_OPTS: --exclude=SC1091,SC1090

